[package]
name = "gcollections"
version = "1.6.0"
authors = [ "Pierre Talbot <pierre.talbot@uni.lu>" ]
edition = "2021"

description = "Generic traits over Rust collections library."
documentation = "https://docs.rs/gcollections/1.6.0/gcollections/"
repository = "https://github.com/ptal/gcollections"
readme = "README.md"
keywords = ["data-structure", "containers", "generic"]
license = "MIT/Apache-2.0"

[lib]

name = "gcollections"
path = "src/libgcollections/lib.rs"

[dependencies]

num-integer = "0.1.46"
num-traits = "0.2.19"
bit-set = "0.9.1"
trilean = "1.1.0"

[features]
nightly = []
